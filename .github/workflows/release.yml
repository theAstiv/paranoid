name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # Build Python package for PyPI
  build-package:
    name: Build Python Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  # Build standalone binaries for Linux, macOS, Windows
  build-binaries:
    name: Build Binary - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: paranoid-linux-x64
            binary_path: dist/paranoid
          - os: macos-latest
            artifact_name: paranoid-macos-arm64
            binary_path: dist/paranoid
          - os: windows-latest
            artifact_name: paranoid-windows-x64.exe
            binary_path: dist/paranoid.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build binary with PyInstaller
        run: pyinstaller paranoid.spec

      - name: Test binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/paranoid
          ./dist/paranoid --help
          ./dist/paranoid version

      # --help alone missed BB-90 (numpy excluded from the spec, so every run
      # failed). Run once rules-only: the provider points at a closed port, so
      # the pipeline falls back to the rule engine and makes no LLM call.
      - name: Rules-only run (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          DEFAULT_PROVIDER: ollama
          OLLAMA_BASE_URL: http://127.0.0.1:9
          DB_PATH: ${{ runner.temp }}/smoke/p.db
        shell: bash  # -o pipefail, so a failing run isn't hidden by tee
        run: |
          ./dist/paranoid run examples/stride-example-api-gateway.md -n 1 | tee smoke.log
          grep -q "Total Threats" smoke.log

      - name: Test binary (Windows)
        if: runner.os == 'Windows'
        run: |
          dist\paranoid.exe --help
          dist\paranoid.exe version

      - name: Rules-only run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DEFAULT_PROVIDER = 'ollama'
          $env:OLLAMA_BASE_URL = 'http://127.0.0.1:9'
          $env:DB_PATH = Join-Path $env:RUNNER_TEMP 'smoke\p.db'
          $env:PYTHONIOENCODING = 'utf-8'
          dist\paranoid.exe run examples\stride-example-api-gateway.md -n 1 | Tee-Object -FilePath smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path smoke.log -Pattern 'Total Threats' -Quiet)) { exit 1 }

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}

  # Publish to PyPI
  publish-pypi:
    name: Publish to PyPI
    needs: build-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/paranoid-cli
    permissions:
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Create GitHub Release with binaries
  create-release:
    name: Create GitHub Release
    needs: [build-package, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # The release takes each file's basename, and the Linux and macOS builds
      # are both named `paranoid`: one overwrote the other (v1.5.0 shipped no
      # Linux binary, BB-115). Give every binary its platform name.
      - name: Name binaries by platform
        run: |
          mkdir -p binaries
          cp paranoid-linux-x64/paranoid binaries/paranoid-linux-x64
          cp paranoid-macos-arm64/paranoid binaries/paranoid-macos-arm64
          cp paranoid-windows-x64.exe/paranoid.exe binaries/paranoid-windows-x64.exe
          chmod +x binaries/paranoid-linux-x64 binaries/paranoid-macos-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Paranoid v${{ steps.get_version.outputs.VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            python-package/*
            binaries/*
          token: ${{ secrets.GITHUB_TOKEN }}
