rules:
  - id: build-install-dynamic-require
    languages: [js, ts]
    severity: WARNING
    message: >-
      Calls `require()` with a non-literal argument — the module loaded is
      determined at runtime, which static analysis (including this scanner)
      cannot fully resolve.
    metadata:
      category: build_install
    patterns:
      - pattern: require($X)
      - pattern-not: require("...")
