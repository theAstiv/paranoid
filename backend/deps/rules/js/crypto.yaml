rules:
  - id: crypto-node-crypto-call
    languages: [js, ts]
    severity: WARNING
    message: >-
      Uses Node's `crypto` module (cipher/hash/hmac/sign/verify/keygen/random)
      — called directly, or passed by reference (util.promisify, .bind,
      callbacks).
    metadata:
      category: crypto
    # References are matched only in use contexts; a bare `$M.$FUNC` would
    # also match inside `const { createHash } = require(...)`, which Semgrep
    # desugars into a member access on the required module.
    patterns:
      - pattern-either:
          - pattern: require($MOD).$FUNC(...)
          - pattern: $CALLEE(..., require($MOD).$FUNC, ...)
          - pattern: require($MOD).$FUNC.bind(...)
          # Module object bound to a name: plain require (var/let/const),
          # require wrapped by TypeScript's __importDefault/__importStar
          # helpers, or an ESM default/namespace import.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $M = <... require($MOD) ...>;
                      ...
                  - pattern-inside: |
                      import $M from $MOD;
                      ...
                  - pattern-inside: |
                      import * as $M from $MOD;
                      ...
              - pattern-either:
                  - pattern: $M.$FUNC(...)
                  - pattern: $M.default.$FUNC(...)
                  # tsc's CommonJS emit for named/default imports
                  - pattern: (0, $M.$FUNC)(...)
                  - pattern: (0, $M.default.$FUNC)(...)
                  - pattern: $CALLEE(..., $M.$FUNC, ...)
                  - pattern: $CALLEE(..., $M.default.$FUNC, ...)
                  - pattern: $M.$FUNC.bind(...)
          # Individual functions pulled out by destructuring or named import.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      const {..., $FUNC, ...} = require($MOD);
                      ...
                  - pattern-inside: |
                      import {..., $FUNC, ...} from $MOD;
                      ...
              - pattern-either:
                  - pattern: $FUNC(...)
                  - pattern: $CALLEE(..., $FUNC, ...)
                  - pattern: $FUNC.bind(...)
      - metavariable-regex:
          metavariable: $MOD
          regex: ^["']?(node:)?crypto["']?$
      - metavariable-regex:
          metavariable: $FUNC
          regex: ^(createCipher(iv)?|createDecipher(iv)?|createHash|createHmac|createSign|createVerify|randomBytes|randomFillSync|randomUUID|generateKeyPair(Sync)?|publicEncrypt|privateDecrypt|privateEncrypt|publicDecrypt|pbkdf2(Sync)?|scrypt(Sync)?)$

  - id: crypto-webcrypto-subtle
    languages: [js, ts]
    severity: WARNING
    message: Uses the WebCrypto `crypto.subtle` API (digest/encrypt/decrypt/sign/verify/generateKey).
    metadata:
      category: crypto
    pattern: crypto.subtle.$FUNC(...)
