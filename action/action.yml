name: 'Paranoid Threat Modeling'
description: 'Run STRIDE + MAESTRO threat modeling on your system description and upload findings to GitHub Security'
author: 'theAstiv'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  description-file:
    description: 'Path to the system description file (.md or .txt), relative to the repository root'
    required: true
  provider:
    description: 'LLM provider: anthropic, openai, ollama, or bedrock. Bedrock uses the AWS credential chain (e.g. aws-actions/configure-aws-credentials in an earlier step), not api-key.'
    required: false
    default: 'anthropic'
  api-key:
    description: 'API key for the LLM provider. Required for anthropic and openai; omit for ollama and bedrock.'
    required: false
    default: ''
  model:
    description: 'Model override (e.g. claude-sonnet-4-5, gpt-4o). Uses provider default when omitted.'
    required: false
    default: ''
  framework:
    description: 'Threat modeling framework: STRIDE or MAESTRO'
    required: false
    default: 'STRIDE'
  iterations:
    description: 'Number of pipeline iterations (1–15). Higher values give broader threat coverage.'
    required: false
    default: '3'
  sarif-output:
    description: 'Path to write the SARIF output file, relative to the repository root'
    required: false
    default: 'paranoid-results.sarif'
  strict:
    description: 'Exit with code 2 if the description has error-severity gaps (missing auth, no trust boundaries, etc.)'
    required: false
    default: 'false'
  fail-on-findings:
    description: 'Fail the workflow step if any threats are identified'
    required: false
    default: 'false'
  aws-region:
    description: 'AWS region for the bedrock provider (e.g. us-east-2). Falls back to the AWS_REGION already in the environment.'
    required: false
    default: ''
  manifest:
    description: 'Path to a package.json for dependency capability analysis, relative to the repository root. Dependency findings are anchored on this file in the SARIF output.'
    required: false
    default: ''
  lockfile:
    description: 'Path to the matching package-lock.json (requires manifest)'
    required: false
    default: ''
  deps-source:
    description: 'Dependency analysis source: npm (fast) or both (adds the npm-tarball vs GitHub-source drift check)'
    required: false
    default: 'npm'
  scoring-method:
    description: 'Severity scoring: dread, cvss, or both'
    required: false
    default: 'dread'
  fast-model:
    description: 'Fast model for the extraction steps. Empty uses the configured default; "none" runs every step on the main model.'
    required: false
    default: ''

outputs:
  sarif-file:
    description: 'Absolute path to the generated SARIF file'

runs:
  using: 'docker'
  image: 'Dockerfile'
